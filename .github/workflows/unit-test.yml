name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load_platforms:
    name: Load platform configurations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Build platform matrix
        id: config
        run: ruby .github/scripts/ci/load_platform_matrix.rb

  unit_tests:
    name: ${{ matrix.display_name }} unit tests
    needs: load_platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load_platforms.outputs.matrix) }}
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: ${{ matrix.platform }}
      display_name: ${{ matrix.display_name }}
      runs_on: ${{ matrix.runs_on }}
      image: ${{ matrix.image }}
      container_options: ${{ matrix.container_options }}
      set_env: ${{ matrix.set_env }}
      suites: ${{ matrix.unit_test_suites }}
